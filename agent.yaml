spec_version: "0.1.0"
name: git-sentinel
version: 1.0.0
description: "Autonomous Git-native Security, Secret & Compliance Gate Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - pr-review
  - secret-remediation

tools:
  - diff-scanner
  - secret-detector
  - policy-checker
  - patch-generator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - security
  - compliance
  - git-native
  - domain-worker
  - passport-challenge

metadata:
  passport_id: "aps-sentinel-01"
  passport_track: "custom-clone-workers"
  author_github: "masood-mashu"
