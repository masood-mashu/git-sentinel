name: secret-detector
description: Scans code, diffs, or text for leaked API keys, tokens, credentials, and high-entropy secrets
version: 1.0.0
input_schema:
  type: object
  properties:
    content:
      type: string
      description: The text or diff content to scan for secrets
    redact:
      type: boolean
      description: Whether to return redacted values for safety
  required:
    - content
implementation:
  type: script
  path: secret_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
